name: Update screener snapshots

on:
  schedule:
    # Every 4 hours while the Indian market is active (roughly 03:45-11:30 UTC).
    # The script itself throttles to hourly during market hours and 4h otherwise.
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build screener snapshots
        run: python update_data.py

      - name: Commit latest snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update screener snapshots [skip ci]"
          file_pattern: |
            data/latest_screener_nifty50.parquet
            data/latest_screener_nifty50.csv
            data/latest_screener_nifty500.parquet
            data/latest_screener_nifty500.csv
